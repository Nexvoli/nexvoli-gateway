<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXVOLI - Find High-Paying Remote & Flexible Jobs</title>
    <meta name="description" content="Find jobs that fit your life. Remote, part-time and full-time positions. No experience needed." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NEXVOLI - Find High-Paying Remote & Flexible Jobs" />
    <meta property="og:description" content="Find jobs that fit your life. Remote, part-time and full-time positions. No experience needed." />
    <meta property="og:image" content="https://images.pexels.com/photos/7693734/pexels-photo-7693734.jpeg" />
  </head>
  <body>

    <!-- THE ABSOLUTE MASTERPIECE CPA GATEWAY (WITH LOCALSTORAGE SESSION CONTROL) -->
    <div id="enterprise-gateway" class="enterprise-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:99999; flex-direction:column; overflow:hidden; background:#020617; font-family:system-ui, sans-serif;">
        <!-- Deep Cyber Space Grid -->
        <div class="enterprise-grid" style="position:absolute; top:0; left:0; width:100%; height:100%; background-image:linear-gradient(rgba(20, 184, 166, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 184, 166, 0.03) 1px, transparent 1px); background-size:60px 60px; z-index:1; pointer-events:none;"></div>
        <div class="ambient-glow" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:60vw; height:60vh; background:radial-gradient(circle, rgba(14,165,233,0.15) 0%, transparent 70%); z-index:0; pointer-events:none;"></div>

        <!-- PHASE 1: TACTICAL SCANNING (Visible for 5s) -->
        <div id="phase-scanning" class="scanning-phase-container" style="display:flex; flex-direction:column; width:100%; height:100%; justify-content:space-between; align-items:center; padding:3vh 0 6vh 0; position:relative; z-index:10;">
            <!-- Live System HUD -->
            <div class="system-hud" style="display:flex; align-items:center; align-self:flex-start; margin-left:5vw; background:rgba(2,6,23,0.85); backdrop-filter:blur(12px); border:1px solid rgba(14,165,233,0.4); padding:10px 25px; border-radius:50px; box-shadow:0 5px 25px rgba(0,0,0,0.6);">
                <div class="hud-indicator" style="width:10px; height:10px; background:#14b8a6; border-radius:50%; margin-right:12px; box-shadow:0 0 15px #14b8a6; animation:blink 1s infinite alternate;"></div>
                <span style="color:#e2e8f0; font-size:0.85rem; font-weight:700; letter-spacing:1.5px;">NEXVOLI SYSTEMS <span style="margin:0 10px; color:#475569;">|</span> <span id="cyber-coords" style="color:#0ea5e9; font-family:monospace; font-weight:bold;">LOC: SYNCING...</span></span>
            </div>

            <!-- RADAR MAP SECTION -->
            <div class="map-section" style="flex:1; width:100%; max-width:1600px; display:flex; justify-content:center; align-items:center; padding:0 10px; max-height:75vh;">
                <svg class="hologram-map" viewBox="0 0 1100 700" preserveAspectRatio="xMidYMid meet" style="width:100%; height:100%; filter:drop-shadow(0 0 25px rgba(14,165,233,0.3));">
                    <g class="radar-background">
                        <line x1="550" y1="50" x2="550" y2="650" stroke="rgba(14,165,233,0.2)" stroke-width="1" stroke-dasharray="4 4" />
                        <line x1="100" y1="350" x2="1000" y2="350" stroke="rgba(14,165,233,0.2)" stroke-width="1" stroke-dasharray="4 4" />
                        <circle cx="550" cy="350" r="200" fill="none" stroke="rgba(14,165,233,0.08)" stroke-width="1" />
                        <circle cx="550" cy="350" r="350" fill="none" stroke="rgba(14,165,233,0.15)" stroke-width="1" stroke-dasharray="8 8" />
                    </g>
                    <g class="compass-markers" fill="#0ea5e9" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle" style="opacity:0.7;">
                        <text x="550" y="30">N</text><text x="550" y="690">S</text><text x="40" y="358">W</text><text x="1060" y="358">E</text>
                    </g>
                    <g transform="translate(60, 50)">
                        <path d="M225,55 L285,45 L350,55 L400,45 L450,55 L490,40 L540,60 L620,40 L690,75 L740,65 L780,105 L830,95 L880,135 L910,135 L960,200 L950,250 L910,290 L890,360 L850,420 L860,500 L840,560 L800,530 L760,490 L710,480 L670,490 L610,460 L570,480 L520,480 L490,440 L450,450 L390,430 L350,410 L280,390 L240,360 L210,310 L160,290 L120,240 L90,200 L80,140 L100,90 L150,70 Z" fill="rgba(14,165,233,0.04)" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="8 4"></path>
                    </g>
                    <g id="dynamic-signals" transform="translate(60, 50)"></g>
                    <g id="scanner-icon" transform="translate(60, 50)" style="filter:drop-shadow(0 0 20px rgba(20,184,166,0.9));">
                        <circle cx="0" cy="0" r="28" fill="rgba(20,184,166,0.1)" stroke="#14b8a6" stroke-width="1.5" />
                        <path d="M-40,0 L-22,0 M22,0 L40,0 M0,-40 L0,-22 M0,22 L0,40" stroke="#14b8a6" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="0" cy="0" r="3" fill="#ffffff" />
                    </g>
                </svg>
            </div>

            <!-- DYNAMIC STATUS PILL -->
            <div class="premium-status-pill" style="background:rgba(15,23,42,0.9); backdrop-filter:blur(25px); border:1px solid rgba(20,184,166,0.5); border-radius:50px; padding:18px 40px; display:flex; align-items:center; gap:20px; box-shadow:0 20px 50px rgba(0,0,0,0.8);">
                <div style="width:24px; height:24px; border:3px solid rgba(20,184,166,0.3); border-top:3px solid #14b8a6; border-radius:50%; animation:spinLoader 1s linear infinite;"></div>
                <span style="color:#f8fafc; font-size:1.15rem; font-weight:700; letter-spacing:0.5px;">SEARCHING JOBS NEAR YOU</span>
            </div>
        </div>

        <!-- PHASE 2: EXCLUSIVE JOB TICKET SUCCESS POPUP -->
        <div id="phase-success" style="display:none; width:100%; height:100%; justify-content:center; align-items:center; z-index:100; background:rgba(2,6,23,0.88); backdrop-filter:blur(15px); position:absolute; top:0; left:0;">
            <!-- পপআপের স্টাইলে max-height এবং overflow-y-auto যুক্ত করা হয়েছে -->
            <div style="background:#ffffff; border-radius:24px; padding:35px 25px 25px 25px; max-width:92%; width:520px; text-align:center; position:relative; max-height:85vh; overflow-y:auto; overflow-x:hidden; box-shadow:0 40px 80px rgba(0,0,0,0.8); animation:popUpTicket 0.5s ease-out forwards;">
                <div style="position:absolute; top:0; left:0; right:0; height:8px; background:linear-gradient(90deg, #0ea5e9, #10b981, #3b82f6);"></div>
                
                <div style="width:60px; height:60px; background:#10b981; border-radius:50%; display:flex; justify-content:center; align-items:center; margin:0 auto 15px auto; box-shadow:0 8px 20px rgba(16,185,129,0.4);">
                    <svg width="30" height="30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
                </div>
                
                <h2 style="color:#0f172a; font-size:1.6rem; font-weight:900; margin-bottom:8px;">Employment Match Confirmed</h2>
                <div style="color:#fbbf24; font-size:1.1rem; margin-bottom:15px;">★★★★★ <span style="color:#475569; font-size:0.85rem; font-weight:600; margin-left:8px;">Verified Employer</span></div>
                <p style="color:#475569; font-size:0.95rem; line-height:1.5; margin-bottom:20px;">We have exclusively reserved a high-paying position for you in your state.</p>
                
                <div style="background:#f8fafc; border:2px solid #e2e8f0; border-radius:16px; padding:18px; margin-bottom:25px; position:relative;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <span style="font-size:0.75rem; color:#64748b; font-weight:700; font-family:monospace;">MATCH ID: <span id="random-id">#US-8842</span></span>
                        <span style="background:#d1fae5; color:#059669; padding:4px 10px; border-radius:20px; font-size:0.75rem; font-weight:700;">⚡ Hiring Now</span>
                    </div>
                    <h3 id="match-job-title" style="color:#0284c7; font-size:1.35rem; font-weight:900; margin:0;">Loading...</h3>
                    <div style="border-top:2px dashed #cbd5e1; margin:15px 0;"></div>
                    <div style="display:flex; justify-content:space-between; padding:0 5px;">
                        <div style="text-align:left;">
                            <span style="font-size:0.75rem; color:#64748b; font-weight:700; text-transform:uppercase; display:block;">Location</span>
                            <span id="match-work-mode" style="font-size:0.95rem; color:#0f172a; font-weight:800;">Remote</span>
                        </div>
                        <div style="text-align:right;">
                            <span style="font-size:0.75rem; color:#64748b; font-weight:700; text-transform:uppercase; display:block;">Position</span>
                            <span id="match-job-type" style="font-size:0.95rem; color:#0f172a; font-weight:800;">Full-Time</span>
                        </div>
                    </div>
                </div>
                
                <!-- YOUR CPA LINK GOES HERE -->
                <a href="https://go2daff.click/click?o=4370&p=20648" target="_blank" onclick="closeGateway()" style="background:linear-gradient(135deg, #2563eb, #1e40af); color:white; padding:15px 18px; border-radius:12px; text-decoration:none; font-size:1.1rem; font-weight:800; display:flex; justify-content:center; align-items:center; box-shadow:0 10px 25px rgba(37,99,235,0.4);">
                    Review Offer & Apply Now
                </a>
                
                <div style="margin-top:20px;">
                    <button onclick="closeGateway()" style="background:none; border:none; color:#94a3b8; font-size:0.9rem; font-weight:600; cursor:pointer; text-decoration:underline;">Decline Offer</button>
                </div>
            </div>
        </div>

        <style>
            @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }
            @keyframes spinLoader { 100% { transform: rotate(360deg); } }
            @keyframes popUpTicket { 0% { transform: scale(0.95) translateY(30px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        </style>

        <script>
            function closeGateway() {
                localStorage.setItem('nexvoli_gateway_shown', 'true');
                document.getElementById('enterprise-gateway').style.display = 'none';
            }

            document.addEventListener("DOMContentLoaded", function() {
                // Check if user has already seen the gateway
                if (localStorage.getItem('nexvoli_gateway_shown') === 'true') {
                    document.getElementById('enterprise-gateway').style.display = 'none';
                    return;
                }

                // Show gateway if first time
                document.getElementById('enterprise-gateway').style.display = 'flex';

                const finalJobs = [
                    { title: "Customer Support Representative", mode: "100% Remote", type: "Part-Time" },
                    { title: "Remote Data Entry Clerk", mode: "Work From Home", type: "Full-Time" },
                    { title: "Virtual Administrative Assistant", mode: "100% Remote", type: "Part-Time" },
                    { title: "Freelance Video Editor", mode: "Remote (US)", type: "Freelance" },
                    { title: "Medical Biller", mode: "Hybrid", type: "Full-Time" }
                ];
                const randomJob = finalJobs[Math.floor(Math.random() * finalJobs.length)];
                
                document.getElementById('match-job-title').innerText = randomJob.title;
                document.getElementById('match-work-mode').innerText = randomJob.mode;
                document.getElementById('match-job-type').innerText = randomJob.type;
                document.getElementById('random-id').innerText = `#US-${Math.floor(1000 + Math.random() * 9000)}`;

                const logicalPath = [{x:820,y:180}, {x:750,y:320}, {x:800,y:480}, {x:600,y:250}, {x:500,y:420}, {x:400,y:250}, {x:300,y:350}];
                let start = Math.floor(Math.random() * (logicalPath.length - 4));
                let path = logicalPath.slice(start, start + 5);
                const scanner = document.getElementById('scanner-icon');
                
                scanner.style.transition = 'transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
                let step = 0;
                setInterval(() => {
                    if(step < path.length) {
                        scanner.style.transform = `translate(${path[step].x}px, ${path[step].y}px)`;
                        document.getElementById('dynamic-signals').innerHTML += `<circle cx="${path[step].x}" cy="${path[step].y}" r="4" fill="#14b8a6"><animate attributeName="opacity" values="1;0" dur="2s" fill="freeze"/></circle>`;
                        step++;
                    }
                }, 1000);

                setInterval(() => {
                    document.getElementById('cyber-coords').innerText = `LOC: ${(Math.random()*(49-25)+25).toFixed(4)}°N, ${(Math.random()*(125-67)+67).toFixed(4)}°W`;
                }, 200);

                setTimeout(() => {
                    document.getElementById('phase-scanning').style.display = 'none';
                    document.getElementById('phase-success').style.display = 'flex';
                }, 5000);
            });
        </script>
    </div>
    <!-- THE ABSOLUTE MASTERPIECE CPA GATEWAY END -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
